name: Signed Book Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-books:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scraping libraries and Playwright
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Run signed edition scraper
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scraper.py

      - name: Save updated seen_books.json and books_feed.json to repository
        run: |
          git config user.name "Book Tracker Bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_books.json books_feed.json
          git diff --staged --quiet || git commit -m "Update signed editions feed"
          git push
          
