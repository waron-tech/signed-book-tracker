<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>Signed First Editions - Diagnostic</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #f59e0b;
      --vip: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 40px;
    }
    h1 { font-size: 1.4rem; margin-bottom: 6px; }
    p { color: var(--muted); font-size: 0.9rem; margin-bottom: 16px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 8px;
    }
    .title { font-weight: 600; font-size: 0.95rem; }
    .shop { color: var(--accent); font-size: 0.75rem; text-transform: uppercase; font-weight: 700; }
    .price { font-weight: 700; font-size: 1rem; margin-top: auto; }
  </style>
</head>
<body>
  <h1>Diagnostic Dashboard</h1>
  <p>If you see these test cards, GitHub Pages is serving your site successfully!</p>
  
  <div class="grid" id="testGrid"></div>

  <script>
    const testBooks = [
      { title: "The Way of Kings (Signed)", shop: "Goldsboro Books", price: "£30.00" },
      { title: "The Book of Noticing", shop: "Waterstones", price: "£20.00" }
    ];

    document.getElementById("testGrid").innerHTML = testBooks.map(b => `
      <div class="card">
        <span class="shop">${b.shop}</span>
        <div class="title">${b.title}</div>
        <div class="price">${b.price}</div>
      </div>
    `).join("");
  </script>
</body>
</html>
