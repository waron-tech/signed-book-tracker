<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <title>Signed First Editions</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #f59e0b;
      --vip: #ef4444;
      --time-badge: #0284c7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 40px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    h1 { font-size: 1.25rem; font-weight: 700; }
    .header-actions {
      display: flex;
      gap: 8px;
    }
    .btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .controls-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .search-bar {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 0.95rem;
    }
    .sort-select {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .chip {
      white-space: nowrap;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .chip.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 600;
    }
    .status-bar {
      padding: 12px 16px;
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
      gap: 14px;
      padding: 0 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .badge-container {
      position: absolute;
      top: 8px;
      left: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 2;
    }
    .vip-badge {
      background: var(--vip);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .time-badge {
      background: rgba(2, 132, 199, 0.9);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 600;
      padding: 3px 7px;
      border-radius: 6px;
    }
    .cover-wrap {
      width: 100%;
      aspect-ratio: 2 / 3;
      background: #0b1120;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .cover-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 6px;
    }
    .shop-tag {
      font-size: 0.7rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 600;
    }
    .book-title {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-footer {
      margin-top: auto;
      padding-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .price { font-weight: 700; font-size: 0.95rem; }
    .buy-btn {
      background: var(--accent);
      color: #000;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 6px 12px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <h1>Signed Editions</h1>
      <div class="header-actions">
        <button class="btn" onclick="loadFeed()">Refresh</button>
      </div>
    </div>
    <div class="controls-row">
      <input type="search" id="searchInput" class="search-bar" placeholder="Search title or author..." oninput="renderBooks()" />
      <select id="sortSelect" class="sort-select" onchange="renderBooks()">
        <option value="newest">Newest</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
      </select>
    </div>
    <div class="filters" id="filterChips"></div>
  </header>

  <div class="status-bar">
    <span id="countText">Loading books...</span>
    <span id="updatedText"></span>
  </div>

  <main class="grid" id="bookGrid"></main>

  <script>
    let allBooks = [];
    let activeFilter = "ALL";

        async function loadFeed() {
      document.getElementById("countText").textContent = "Refreshing...";
      try {
        const res = await fetch(`books_feed.json?t=${Date.now()}`);
        if (!res.ok) throw new Error("Network response was not ok");
        const data = await res.json();
        allBooks = data.books || [];
        const updatedDate = new Date(data.last_updated || Date.now());
        document.getElementById("updatedText").textContent =
          "Synced " + updatedDate.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      } catch (err) {
        console.warn("Using fallback or retry:", err);
        // Fallback test card so the UI proves it works if fetch fails
        allBooks = [
          {
            id: "test::1",
            title: "Connection Test: Dashboard is Working!",
            author: "System Check",
            price: "£0.00",
            shop: "GitHub Pages",
            url: "https://github.com",
            image: "",
            vip: true,
            discovered_at: new Date().toISOString()
          }
        ];
        document.getElementById("updatedText").textContent = "Offline Mode / Check Feed";
      }
      buildChips();
      renderBooks();
    }


    function timeAgo(isoString) {
      if (!isoString) return "";
      const diffMins = Math.floor((new Date() - new Date(isoString)) / 60000);
      if (diffMins < 1) return "Just now";
      if (diffMins < 60) return `${diffMins}m ago`;
      const diffHours = Math.floor(diffMins / 60);
      if (diffHours < 24) return `${diffHours}h ago`;
      const diffDays = Math.floor(diffHours / 24);
      return `${diffDays}d ago`;
    }

    function parsePrice(priceStr) {
      const match = priceStr.replace(/[^0-9.]/g, "");
      return match ? parseFloat(match) : 0;
    }

    function buildChips() {
      const shops = [...new Set(allBooks.map(b => b.shop))];
      const container = document.getElementById("filterChips");
      const filters = ["ALL", "VIP WATCHLIST", ...shops];
      container.innerHTML = filters.map(f => `
        <button class="chip ${activeFilter === f ? 'active' : ''}" onclick="setFilter('${f.replace(/'/g, "\\'")}')">
          ${f}
        </button>
      `).join("");
    }

    function setFilter(f) {
      activeFilter = f;
      buildChips();
      renderBooks();
    }

    function renderBooks() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const sortBy = document.getElementById("sortSelect").value;

      let filtered = allBooks.filter(b => {
        const matchesQuery = b.title.toLowerCase().includes(q) || (b.author && b.author.toLowerCase().includes(q));
        if (!matchesQuery) return false;
        if (activeFilter === "VIP WATCHLIST") return b.vip;
        if (activeFilter !== "ALL") return b.shop === activeFilter;
        return true;
      });
